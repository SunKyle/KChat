# ==================== Spring Boot 基础配置 ====================
spring:
  application:
    name: kchat-backend
  # 文件上传配置（用于声音克隆 prompt 音频上传等场景）
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB # 单个文件最大 50MB
      max-request-size: 50MB # 单次请求最大 50MB
  # MySQL 数据源配置
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kchatdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:sxk1997sxk}
    # HikariCP 连接池配置
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  # JPA / Hibernate 配置
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update # 启动时自动更新表结构（开发环境，生产建议改为 validate）
    open-in-view: false # 关闭 OSIV，避免请求期间持有数据库连接
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  # Redis 配置（缓存 + 向量存储）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT_MS:60000ms}
      enabled: ${REDIS_ENABLED:true}

# ==================== Ollama LLM 服务配置 ====================
ollama:
  base-url: http://localhost:11434 # Ollama 服务地址
  default-model: llama3 # 默认对话模型
  timeout-minutes: 2 # 单次同步生成超时时间（分钟）
  models-cache-ttl-ms: 30000 # 模型列表缓存 TTL（毫秒）
  image-fetch-connect-timeout-ms: 5000 # 图片转 base64 的连接超时
  image-fetch-read-timeout-ms: 10000 # 图片转 base64 的读取超时
  embed-connect-timeout-ms: 5000 # embedding 接口连接超时
  embed-read-timeout-ms: 30000 # embedding 接口读取超时
  list-models-connect-timeout-ms: 5000 # 获取模型列表连接超时
  list-models-read-timeout-ms: 10000 # 获取模型列表读取超时

# ==================== CosyVoice TTS 语音合成配置 ====================
cosyvoice:
  enabled: false # 是否启用 CosyVoice TTS 服务（当前已关闭）
  base-url: http://127.0.0.1:50000 # CosyVoice FastAPI 服务地址
  default-mode: zero-shot # 默认合成模式: sft | zero-shot | cross-lingual | instruct2
  default-spk-id: 'my_voice' # 默认朗读音色 ID（需在 CosyVoice 侧已注册）
  default-speed: 1.0 # 默认语速 (0.5~2.0)
  default-text-frontend: true # 是否启用文本前端归一化（数字/符号转中文读法）
  use-cache: true # 是否启用 CosyVoice 服务端 LRU 缓存
  connect-timeout-ms: 5000 # 连接超时 5 秒
  read-timeout-ms: 180000 # 读取超时 3 分钟（CPU 推理较慢）
  max-text-length: 2000 # 单次合成最大文本长度（与 CosyVoice 限制对齐）

# ==================== Resilience4j 容错配置 ====================
resilience4j:
  retry:
    instances:
      # Ollama 重试策略
      ollamaRetry:
        max-attempts: 3 # 最多重试 3 次
        wait-duration: 2s # 每次重试间隔 2 秒
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.lang.RuntimeException
      # CosyVoice 重试策略
      cosyvoiceRetry:
        max-attempts: 2 # 最多重试 2 次（TTS 不宜过多重试）
        wait-duration: 1s # 每次重试间隔 1 秒
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
  circuitbreaker:
    instances:
      # Ollama 熔断器
      ollamaCB:
        register-health-indicator: true
        sliding-window-size: 10 # 滑动窗口大小 10 次调用
        minimum-number-of-calls: 5 # 至少 5 次调用才计算失败率
        failure-rate-threshold: 50 # 失败率阈值 50% 触发熔断
        wait-duration-in-open-state: 10s # 熔断开启后 10 秒尝试半开
        permitted-number-of-calls-in-half-open-state: 3 # 半开状态允许 3 次试探
      # CosyVoice 熔断器
      cosyvoiceCB:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60 # 失败率阈值 60%（TTS 容忍度略高）
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2

# ==================== 记忆系统配置 ====================
memory:
  # 短期记忆（会话级滑动窗口）
  short-term:
    max-messages: 20 # 最多保留最近 20 条消息作为 LLM 上下文
    ttl-hours: 24 # Redis 中短期记忆的过期时间（小时）
    redis-key-prefix: "kchat:memory:" # Redis 键前缀
  # 长期记忆（RAG 向量检索）
  long-term:
    enabled: true # 是否启用长期记忆召回
    max-recall: 5 # 每次召回最多 5 条相关记忆
    min-importance: 3 # 重要性低于 3 的记忆不召回
    similarity-threshold: 0.3 # 相似度阈值，低于 0.3 视为不相关
    vector-dimension: 384 # 嵌入向量维度（all-MiniLM-L6-v2 = 384）
    embedding-model: locusai/all-minilm-l6-v2 # Ollama 嵌入模型，用于本地嵌入模型加载失败时降级
  # 记忆提取器（从对话中自动提取关键信息）
  extractor:
    enabled: true # 是否启用自动记忆提取
    message-threshold: 5 # 每 5 条消息触发一次提取
    min-confidence: 50 # 置信度低于 50% 的记忆不保存
    min-importance: 4 # 重要性低于 4 的记忆不保存
    idle-timeout-minutes: 5 # 对话空闲 5 分钟后触发提取
    auto-extract-enabled: true # 是否启用自动提取
    context-window-size: 20 # 提取时回看最近 20 条消息作为上下文

# ==================== Prompt 工程配置 ====================
prompt:
  # 输入安全校验
  security:
    max-input-length: 4096 # 用户输入最大 4096 字符
    min-input-length: 1 # 最小 1 字符
    enable-sanitize: true # 是否启用敏感词过滤/XSS 清洗
  # Token 管理
  token:
    max-tokens: 8192 # 单次对话最大 Token 数
    encoding-type: cl100k_base # Token 编码方式（GPT 系列通用）
  # Prompt 指标采集
  metrics:
    enabled: true # 是否启用 Prompt 指标采集
    collect-interval-seconds: 60 # 每 60 秒采集一次
  # Prompt 模板管理
  template:
    default-id: default-system-prompt # 默认系统 Prompt 模板 ID
    cache-enabled: true # 是否启用模板缓存
    cache-ttl-seconds: 300 # 模板缓存有效期 5 分钟

# ==================== Web 搜索配置 ====================
websearch:
  enabled: true # 是否启用联网搜索增强
  timeout-seconds: 8 # 搜索请求超时 8 秒
  max-results: 5 # 每次返回最多 5 条结果
  engine: bing # 搜索引擎: bing | google
  bing-api-key: '' # Bing Search API Key（留空则不启用）

# ==================== 日志配置 ====================
# 使用 logback-spring.xml 统一管理日志输出，此处仅保留占位
# 查看完整 prompt: tail -f logs/prompt.log
logging:
  level:
    root: WARN
    PROMPT_LOG: INFO
    com.example.app: INFO

# ==================== 限流配置 ====================
rate-limit:
  enabled: true # 是否启用接口限流
  requests-per-minute: 10 # 每个窗口内最大请求数
  cache-prefix: 'optimize:rate:' # Redis 限流计数缓存前缀
  window-seconds: 60 # 滑动窗口时间（秒）

# ==================== Prompt 优化模型配置 ====================
optimization:
  model: llama3 # 用于 Prompt 优化的模型

# ==================== OpenAI 兼容客户端配置 ====================
# 所有基于 OpenAI API 协议的请求（Ollama 之外的第三方、自建 OpenAI 兼容网关等）
openai-client:
  sync-temperature: 0.3 # 同步（非流式）对话温度
  stream-temperature: 0.7 # 流式对话温度
  default-max-tokens: 4096 # 单次响应默认最大 token
  stream-buffer-size: 8192 # 流式响应读取缓冲区大小（字节）
  sd:
    steps: 20 # Stable Diffusion 采样步数
    cfg-scale: 7.0 # CFG Scale（提示词相关性）
    denoising-strength: 0.75 # img2img 去噪强度
  image-gen:
    connect-seconds: 30
    read-seconds: 60
    write-seconds: 30
  sd-webui:
    connect-seconds: 30
    read-seconds: 120
    write-seconds: 30
  chat:
    connect-seconds: 30
    read-seconds: 120
    write-seconds: 30
  multimodal:
    connect-seconds: 30
    read-seconds: 180
    write-seconds: 30
  stream:
    connect-seconds: 30
    read-seconds: 300
    write-seconds: 30
  local-fetch:
    connect-seconds: 5
    read-seconds: 5
    write-seconds: 5
  remote-fetch:
    connect-seconds: 10
    read-seconds: 30
    write-seconds: 10

# ==================== 应用级配置（文件上传、图片等） ====================
app:
  image:
    upload-dir: uploads/images # 本地图片上传目录
    base-url: http://localhost:8080/api/images/ # 访问上传图片的 URL 前缀

# ==================== Cognee 记忆图谱配置 ====================
cognee:
  enabled: true # 是否启用 Cognee 知识图谱记忆
  base-url: http://localhost:8000 # Cognee 服务地址
  search:
    top-k: 5 # 图谱检索返回 Top 5 相关节点
    threshold: 0.3 # 相似度阈值
  index:
    enabled: true # 是否启用自动索引构建
