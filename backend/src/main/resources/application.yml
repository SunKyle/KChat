spring:
  application:
    name: kchat-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/kchatdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    driverClassName: com.mysql.cj.jdbc.Driver
    username: admin
    password: sxk1997sxk
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms
      enabled: true

ollama:
  base-url: http://localhost:11434
  default-model: llama3

resilience4j:
  retry:
    instances:
      ollamaRetry:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.lang.RuntimeException
  circuitbreaker:
    instances:
      ollamaCB:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

memory:
  long-term:
    enabled: true
    max-recall: 5
    min-importance: 3
    similarity-threshold: 0.3
    vector-dimension: 384
  extractor:
    enabled: true
    message-threshold: 1
    min-confidence: 30
    min-importance: 3
    idle-timeout-minutes: 10
    auto-extract-enabled: true

logging:
  level:
    root: INFO
    com.example.app: DEBUG
    com.example.app.service: DEBUG
    com.example.app.controller: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
